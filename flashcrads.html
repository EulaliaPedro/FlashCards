<!doctype html>
<html lang="eng">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flashcard Example</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="flashcard-container">
      <h1>Flashcard</h1>
      <div id="flashcard" class="flashcard">
        <div class="front">
          <p id="question">Please Pick A Card Set!</p>
        </div>
        <div class="back">
          <img id="answer-img" src="" alt="Answer" />
        </div>
      </div>
      <div id="buttons">
        <button id="flip-card">Flip Card</button>
        <button id="next-card">Next</button>
      </div>
    </div>
    <div id="note-range">
      <button id="low-range">low range</button>
      <button id="middle-range">middle range</button>
      <button id="higher-range">higer range</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
